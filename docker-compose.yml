services:
  jobmanager:
    image: flink:1.18-scala_2.12
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    volumes:
      - ./data:/opt/flink/data
      - ./flink_ecommerce_pipeline.sql:/opt/flink/flink_ecommerce_pipeline.sql

  taskmanager:
    image: flink:1.18-scala_2.12
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - ./data:/opt/flink/data

  sql-client:
    image: flink:1.18-scala_2.12
    command: bin/sql-client.sh
    depends_on:
      - jobmanager
      - taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    volumes:
      - ./data:/opt/flink/data
      - ./flink_ecommerce_pipeline.sql:/opt/flink/flink_ecommerce_pipeline.sql
